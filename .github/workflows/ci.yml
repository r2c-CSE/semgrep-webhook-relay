name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t semgrep-webhook-relay:ci .
      - name: Validate the example config in the image
        run: >-
          docker run --rm
          -e SEMGREP_WEBHOOK_SECRET=example-secret-123
          -e SPLUNK_HEC_URL=https://splunk.example.com:8088
          -e SPLUNK_HEC_TOKEN=example
          -e TEAMS_WORKFLOW_URL=https://teams.example.com/workflow
          -v "$PWD/config.example.yaml:/config/relay.yaml:ro"
          semgrep-webhook-relay:ci check-config
