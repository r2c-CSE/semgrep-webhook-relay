[project]
name = "semgrep-webhook-relay"
version = "0.1.0"
description = "Unofficial, experimental relay that receives Semgrep webhooks and forwards them to other tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
semgrep-webhook-relay = "semgrep_relay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semgrep_relay"]

[tool.uv]
# Supply-chain guard: never resolve a package version published in the last week.
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette now prefers httpx2 for its test client; httpx still works.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
